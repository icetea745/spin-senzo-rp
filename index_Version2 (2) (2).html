<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Senzo RP - Naruto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Fond Naruto - Motif */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,107,107,0.1)" stroke-width="2"/><circle cx="50" cy="50" r="20" fill="none" stroke="rgba(255,107,107,0.1)" stroke-width="2"/></svg>');
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(15, 52, 96, 0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 107, 107, 0.4);
            border: 3px solid #ff6b6b;
            max-width: 800px;
            margin: 20px;
        }

        h1 {
            color: #ff6b6b;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8), 0 2px 10px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #ffd700;
            font-size: 1.2em;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .wheels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .wheel-card {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            padding: 25px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            border: 2px solid #ffab91;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .wheel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .wheel-card:hover::before {
            left: 100%;
        }

        .wheel-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 50px rgba(255, 107, 107, 0.6), 0 0 30px rgba(255, 107, 107, 0.4);
            background: linear-gradient(135deg, #ffab91 0%, #ff6b6b 100%);
        }

        .wheel-number {
            display: inline-block;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 0.9em;
        }

        .footer {
            margin-top: 40px;
            color: #b0b0b0;
            font-size: 0.9em;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
        }

        .footer strong {
            color: #ffd700;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }

            .wheels-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍜 SPIN SENZO RP 🍜</h1>
        <p class="subtitle">Les Roues de la Destinée Ninja</p>

        <div class="wheels-grid">
            <a href="https://spinthewheel.io/fr/wheels/2xzxF7V7WlUJJVPJBE4Ccz0xJmU9MQ==" class="wheel-card" target="_blank">
                <span class="wheel-number">⚡</span> Element
            </a>
            <a href="https://spinthewheel.io/fr/wheels/EVDJmjSW9c60FeBA4S1Zcz0xJmU9MQ==" class="wheel-card" target="_blank">
                <span class="wheel-number">🔥</span> Maitrise
            </a>
            <a href="https://spinthewheel.io/fr/wheels/GSJR9P5JTw40is0TSbkYcz0xJmU9MQ==" class="wheel-card" target="_blank">
                <span class="wheel-number">💨</span> Kumo
            </a>
            <a href="https://spinthewheel.io/fr/wheels/ZxkZSsz3myHIGbZVHxNTcz0xJmU9MQ==" class="wheel-card" target="_blank">
                <span class="wheel-number">💧</span> Suna
            </a>
        </div>

        <div class="footer">
            <p>✨ <strong>Spin Senzo RP</strong> - Bienvenue dans le monde des ninjas ✨</p>
        </div>
    </div>
</body>
</html>
